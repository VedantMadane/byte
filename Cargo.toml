[package]
name = "byte"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "claude account switcher"
repository = "https://github.com/lindstrm/byte"
readme = "README.md"

[[bin]]
name = "byte"
path = "src/main.rs"

[lib]
name = "byte"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
keyring = { version = "4.1.6", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
